services:
  - type: worker
    name: remiText
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: PORT
        value: "10000"
      # Recycle Spectrum connection if no inbound texts (default 30 min).
      - key: STREAM_STALE_MS
        value: "1800000"
      # Proactive reconnect every 6h even when active (avoids silent stale gRPC).
      - key: STREAM_REFRESH_MS
        value: "21600000"
      - key: PROJECT_ID
        sync: false
      - key: PROJECT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_HTTP_TIMEOUT_MS
        sync: false
      - key: MAX_AGENT_TOOL_ROUNDS
        sync: false
      - key: MESSAGE_HANDLER_TIMEOUT_MS
        sync: false
      - key: DUFFEL_API_KEY_PROD
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_ISSUING_CARD_SPENDING_LIMITS_CURRENCY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: REMI_PHONE
        sync: false
      - key: RESY_API_KEY
        sync: false
      - key: RESY_EMAIL
        sync: false
      - key: RESY_PASSWORD
        sync: false
      - key: RESY_AUTH_TOKEN
        sync: false
      - key: RESY_PAYMENT_METHOD_ID
        sync: false
      - key: MONID_API_KEY
        sync: false
