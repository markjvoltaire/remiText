services:
  - type: worker
    name: remiText
    runtime: node
    repo: https://github.com/markjvoltaire/remiText
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: PORT
        value: "10000"
      # Idle stale-recycle (off by default — 30m caused ~48 createClient/day and Spectrum 429s).
      # Set e.g. 14400000 (4h) only if you need faster zombie detection than refresh below.
      - key: STREAM_STALE_MS
        value: "0"
      # Proactive reconnect every 6h even when active (avoids silent stale gRPC).
      - key: STREAM_REFRESH_MS
        value: "21600000"
      # Single-instance lease (Supabase): guarantees ONE Spectrum consumer per
      # PROJECT_ID. A second worker (stray local `npm start`, overlapping deploy)
      # stands by without connecting instead of tripping Spectrum's 429 limit.
      # Requires migration 20250528120000_create_worker_lease.sql. Set to "0" to
      # disable. TTL/heartbeat tunables: WORKER_LEASE_TTL_MS, WORKER_LEASE_HEARTBEAT_MS.
      - key: WORKER_LEASE_ENABLED
        value: "1"
      - key: PROJECT_ID
        sync: false
      - key: PROJECT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_HTTP_TIMEOUT_MS
        sync: false
      - key: MAX_AGENT_TOOL_ROUNDS
        sync: false
      - key: MESSAGE_HANDLER_TIMEOUT_MS
        sync: false
      - key: DUFFEL_ENV
        value: test
      - key: DUFFEL_API_KEY
        sync: false
      - key: DUFFEL_API_KEY_PROD
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_ISSUING_CARD_SPENDING_LIMITS_CURRENCY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: REMI_PHONE
        sync: false
      - key: RESY_API_KEY
        sync: false
      - key: RESY_EMAIL
        sync: false
      - key: RESY_PASSWORD
        sync: false
      - key: RESY_AUTH_TOKEN
        sync: false
      - key: RESY_PAYMENT_METHOD_ID
        sync: false
      - key: MONID_API_KEY
        sync: false
      - key: COMPOSIO_API_KEY
        sync: false
      - key: COMPOSIO_TICKETMASTER_VERSION
        value: "20260417_00"
      - key: COMPOSIO_TICKETMASTER_CONNECTED_ACCOUNT_ID
        sync: false
